<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>James Zhu</title>

  <!-- Font Awesome icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

      color: white;

      background:
        radial-gradient(circle at 15% 20%, rgba(80, 120, 255, 0.45), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(170, 90, 255, 0.35), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(70, 200, 255, 0.25), transparent 35%),
        #06070b;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    /* Main liquid glass panel */
    .glass {
      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.18);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.12);

      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);

      border-radius: 32px;

      padding: 42px 28px;
    }

    h1 {
      font-size: 42px;
      font-weight: 650;
      letter-spacing: -1.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: rgba(255,255,255,0.65);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .email-section {
      margin-bottom: 26px;
      line-height: 1.8;
    }

    .email {
      display: block;
      text-decoration: none;
      color: rgba(255,255,255,0.78);
      font-size: 14px;

      transition: 0.2s ease;
    }

    .email:hover {
      color: white;
    }

    .email i {
      margin-right: 7px;
      opacity: 0.75;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Glass buttons */
    .link {
      display: flex;
      align-items: center;

      width: 100%;

      padding: 17px 20px;

      border-radius: 18px;

      color: white;
      text-decoration: none;

      font-size: 16px;
      font-weight: 550;

      background: rgba(255,255,255,0.07);

      border: 1px solid rgba(255,255,255,0.13);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border 0.25s ease,
        box-shadow 0.25s ease;
    }

    .link:hover {
      transform: translateY(-3px) scale(1.01);

      background: rgba(255,255,255,0.14);

      border-color: rgba(255,255,255,0.28);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .link i {
      width: 26px;
      font-size: 20px;
      text-align: center;
      margin-right: 14px;
    }

    .link-text {
      flex: 1;
      text-align: left;
    }

    .arrow {
      color: rgba(255,255,255,0.40);
      font-size: 13px;
    }

    /* Resume gets slightly stronger glass */
    .resume {
      background:
        linear-gradient(
          135deg,
          rgba(110, 140, 255, 0.24),
          rgba(180, 100, 255, 0.18)
        );

      border-color: rgba(180,190,255,0.30);
    }

    footer {
      margin-top: 28px;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
    }

    /* mobile */
    @media (max-width: 600px) {
      .glass {
        padding: 34px 20px;
        border-radius: 26px;
      }

      h1 {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="glass">

      <h1>James Zhu</h1>

        Electrical Engineering @ University of Waterloo

      </div>

      <footer>

    </section>

  </main>

</body>
</html>
