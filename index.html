<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>James Zhu</title>

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(60, 110, 255, 0.50),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(180, 80, 255, 0.40),
          transparent 32%
        ),
        radial-gradient(
          circle at 50% 90%,
          rgba(40, 190, 255, 0.30),
          transparent 38%
        ),
        #06070b;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 20px;
    }


    /* MAIN CONTAINER */

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }


    /* LIQUID GLASS CARD */

    .glass {
      position: relative;
      overflow: hidden;

      padding: 45px 28px;

      border-radius: 32px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.12),
          rgba(255,255,255,0.04)
        );

      border: 1px solid rgba(255,255,255,0.18);

      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);

      box-shadow:
        0 25px 70px rgba(0,0,0,0.40),
        inset 0 1px 0 rgba(255,255,255,0.20);
    }


    /* LIGHT REFLECTION */

    .glass::before {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      top: -200px;
      left: -100px;

      border-radius: 50%;

      background: rgba(255,255,255,0.15);

      filter: blur(60px);

      pointer-events: none;
    }


    /* NAME */

    h1 {
      position: relative;

      font-size: 44px;
      font-weight: 650;

      letter-spacing: -1.5px;

      margin-bottom: 10px;
    }


    /* DESCRIPTION */

    .subtitle {
      position: relative;

      color: rgba(255,255,255,0.62);

      font-size: 15px;
      line-height: 1.7;

      margin-bottom: 24px;
    }


    /* EMAIL */

    .email-section {
      position: relative;

      display: flex;
      flex-direction: column;

      gap: 7px;

      margin-bottom: 28px;
    }


    .email {
      color: rgba(255,255,255,0.72);

      text-decoration: none;

      font-size: 14px;

      transition: 0.2s;
    }


    .email:hover {
      color: white;
    }


    .email i {
      margin-right: 7px;
    }


    /* LINKS */

    .links {
      position: relative;

      display: flex;
      flex-direction: column;

      gap: 14px;
    }


    /* GLASS BUTTON */

    .link {
      display: flex;
      align-items: center;

      width: 100%;

      padding: 17px 20px;

      border-radius: 18px;

      color: white;
      text-decoration: none;

      font-size: 16px;
      font-weight: 550;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.10),
          rgba(255,255,255,0.04)
        );

      border: 1px solid rgba(255,255,255,0.14);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }


    /* HOVER */

    .link:hover {
      transform: translateY(-3px) scale(1.01);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.18),
          rgba(255,255,255,0.08)
        );

      border-color: rgba(255,255,255,0.30);

      box-shadow:
        0 12px 35px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }


    /* CLICK EFFECT */

    .link:active {
      transform: scale(0.97);
    }


    /* ICON */

    .link i {
      width: 28px;

      font-size: 21px;

      text-align: center;

      margin-right: 14px;
    }


    .link-text {
      flex: 1;
      text-align: left;
    }


    /* ARROW */

    .arrow {
      font-size: 12px !important;

      color: rgba(255,255,255,0.35);

      margin-right: 0 !important;
    }


    /* SPECIAL RESUME BUTTON */

    .resume {
      background:
        linear-gradient(
          135deg,
          rgba(90,130,255,0.25),
          rgba(175,90,255,0.18)
        );

      border-color: rgba(170,180,255,0.30);
    }


    /* FOOTER */

    footer {
      position: relative;

      margin-top: 28px;

      color: rgba(255,255,255,0.30);

      font-size: 12px;
    }


    /* PHONE */

    @media (max-width: 600px) {

      body {
        padding: 20px 15px;
      }

      .glass {
        padding: 36px 20px;

        border-radius: 27px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 14px;
      }

      .link {
        padding: 16px 18px;
      }

    }

  </style>

</head>


<body>

  <main class="container">

    <section class="glass">


      <!-- NAME -->

      <!-- INTRO -->

      <p class="subtitle">

      <!-- EMAIL -->

        <a

        </a>

      </div>



      <!-- BUTTONS -->

      <div class="links">


        <!-- GITHUB -->

        <a
          class="link"

        >

          <i class="fa-brands fa-github"></i>

          <span class="link-text">
            GitHub
          </span>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </a>



        <!-- LINKEDIN -->

        <a
          class="link"

          <i class="fa-brands fa-linkedin"></i>

            LinkedIn
          </span>

          <i class="fa-solid fa-chevron-right arrow"></i>

        </a>



        <!-- INSTAGRAM -->

        <a

        </a>



     


      </div>


      <footer>
        © 2026 James Zhu
      </footer>


    </section>

  </main>

</body>

</html>
